<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<!-- 状态栏颜色跟着深浅色走，和顶栏一致（顶栏是 card 色） -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171c">
<style>html,body{background:#15171c}@media (prefers-color-scheme: light){html,body{background:#ffffff}}</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- default：iOS 给状态栏单独留一条实心区域（颜色取 theme-color），页面从状态栏下面开始 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Panes">
<title>Pane Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div id="app"></div>
<script>
  // 保底（普通脚本，比页面主脚本先跑）：主脚本有任何报错都上报；6 秒还没显示出来就给恢复按钮，不让页面一直白着
  ;(function () {
    var report = function (kind, msg) { try { navigator.sendBeacon('api/log', JSON.stringify({ kind: kind, msg: String(msg).slice(0, 3000), t: Date.now() })) } catch (e) {} }
    window.__report = report
    // 懒加载分块的预载（link rel=modulepreload）没取到：多半是断网的那一下，lib/lazy 等网络回来会重试，只记一笔，不当问题
    addEventListener('error', function (e) { var el = e.target; if (el && el.tagName === 'LINK' && el.rel === 'modulepreload') return report('lazy-net', el.href) }, true)
    addEventListener('error', function (e) { if (e.target && e.target.tagName === 'LINK' && e.target.rel === 'modulepreload') return; if (!e.filename && !e.lineno && !e.error && /^Script error\.?$/.test(e.message || '')) return; report('error', (e.message || (e.target && (e.target.src || e.target.href)) || 'resource') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + ' ' + (e.error && e.error.stack || '')) }, true)
    addEventListener('unhandledrejection', function (e) { report('rejection', e.reason && (e.reason.stack || e.reason.message) || e.reason) })
    // 6 秒没显示：先带随机参数重新下载主脚本和样式（绕开浏览器里可能已经坏掉的缓存），再等 8 秒还不行才给按钮
    function retry() {
      var t = Date.now()
      var s = document.querySelector('script[type=module][src*="assets/"]')
      var c = document.querySelector('link[rel=stylesheet][href*="assets/"]')
      if (c) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = c.getAttribute('href') + '?b=' + t; document.head.appendChild(l) }
      if (s) { var n = document.createElement('script'); n.type = 'module'; n.src = s.getAttribute('src') + '?b=' + t; document.body.appendChild(n) }
      report('retry', 'reloading main script with cache-bust')
    }
    var waited = false
    setTimeout(function check() {
      if (window.__mounted) return
      // 主脚本已经在跑、只是在等接管（main.ts 设 __booted，接管最多等 5 秒）：再给 6 秒，不算卡住
      if (window.__booted && !waited) { waited = true; return setTimeout(check, 6000) }
      report('stuck', 'not mounted after ' + (waited ? '12' : '6') + 's; booted=' + !!window.__booted + ' sw=' + !!(navigator.serviceWorker && navigator.serviceWorker.controller) + ' online=' + navigator.onLine)
      retry()
      setTimeout(showRecovery, 8000)
    }, 6000)
    function showRecovery() {
      if (window.__mounted) return
      report('stuck2', 'still not mounted after cache-bust retry')
      var box = document.createElement('div')
      box.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;padding:24px;font:15px -apple-system,sans-serif;text-align:center;background:inherit;color:#888'
      var zh = (function () { try { var v = localStorage.getItem('lang'); if (v === 'zh' || v === 'en') return v === 'zh' } catch (e) {} var ls = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']; for (var k = 0; k < ls.length; k++) if (/^zh\b/i.test(ls[k])) return true; return false })()
      var L = zh ? ['页面没有加载出来', '重新加载', '清除缓存并重新加载'] : ['The page failed to load', 'Reload', 'Clear cache and reload']
      box.innerHTML = '<div>' + L[0] + '<br><br><button id="r1" style="font:inherit;padding:10px 18px;margin:6px">' + L[1] + '</button><button id="r2" style="font:inherit;padding:10px 18px;margin:6px">' + L[2] + '</button></div>'
      document.body.appendChild(box)
      document.getElementById('r1').onclick = function () { location.replace(location.pathname + '?r=' + Date.now()) }
      document.getElementById('r2').onclick = async function () {
        try {
          var regs = await navigator.serviceWorker.getRegistrations()
          // 推送订阅跟着 SW 走，注销后要在通知设置里重新开一次
          for (var i = 0; i < regs.length; i++) await regs[i].unregister()
          var ks = await caches.keys()
          for (var j = 0; j < ks.length; j++) await caches.delete(ks[j])
        } catch (e) {}
        location.replace(location.pathname + '?r=' + Date.now())
      }
    }
  })()
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
